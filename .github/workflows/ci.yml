name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    # Both versions must pass; 3.10 uses tomli for TOML parsing.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install -U pip wheel
          pip install -e ".[dev]"
      - name: Lint import
        run: python -c "from chirpctl.cli import main; print('ok')"
      - name: Tests
        run: pytest -q tests/test_smoke.py
